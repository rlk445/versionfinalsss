name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Conferir arquivos do projeto
        run: |
          echo "== Sources =="; ls Sources
          echo "== Ambientes =="
          missing=0
          for d in desert winterlodge bubbles ryokan dome spacestation cybercity; do
            if [ -f "Resources/$d/scene.bin" ]; then
              echo "OK   $d ($(ls Resources/$d | wc -l) arquivos)"
            else
              echo "FALTA Resources/$d/scene.bin"; missing=1
            fi
          done
          grep -q "handsdf_fragment" Sources/Shaders.metal && echo "OK   mao translucida (shader)" || { echo "FALTA shader da mao nova"; missing=1; }
          grep -q "VRButton" Sources/ContentView.swift && echo "OK   botao modo VR" || { echo "FALTA botao VR"; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "::error::Faltam arquivos no repositorio. Envie TODA a pasta (Sources, Resources, project.yml...)."
            exit 1
          fi

      - name: Baixar modelo de mãos do MediaPipe
        run: |
          curl -L --fail -o Resources/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la Resources/hand_landmarker.task

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Instalar pods
        run: pod install

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild \
            -workspace Metulas.xcworkspace \
            -scheme Metulas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Metulas.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Metulas.xcarchive/Products/Applications/Metulas.app Payload/
          echo "== scene.bin dentro do app =="
          find Payload -name scene.bin | sort
          test "$(find Payload -name scene.bin | wc -l | tr -d ' ')" = "7" || { echo "::error::O app nao contem os 7 ambientes"; exit 1; }
          zip -qry Metulas-build-${{ github.run_number }}.ipa Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Metulas-ipa-build-${{ github.run_number }}
          path: Metulas-build-${{ github.run_number }}.ipa
